<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de E-mail - PlatOne</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
    
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    table { border-collapse: collapse !important; }
    
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      background-color: #000000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }

    @media screen and (max-width: 520px) {
      .container { width: 100% !important; padding: 12px !important; }
      .card { padding: 32px 20px !important; }
      .otp-code { font-size: 26px !important; letter-spacing: 6px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 48px 12px; background-color: #000000; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">

  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
      <td align="center">
        
        <table role="presentation" class="container" border="0" cellpadding="0" cellspacing="0" width="440" style="max-width: 440px; width: 100%;">
          
          <!-- Header com Logo Branca Oficial -->
          <tr>
            <td style="padding-bottom: 24px;">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align: middle;">
                    <svg width="32" height="32" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">

                    </svg>
                  </td>
                  <td style="padding-left: 10px; vertical-align: middle;">
                    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">
                      PlatOne
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Cartão Monocromático Preto -->
          <tr>
            <td class="card" style="background-color: #0a0a0a; border: 1px solid #27272a; border-radius: 12px; padding: 36px 32px;">
              
              <!-- Tag Monocromática -->
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #a1a1aa; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 16px;">
                // CONFIRMAÇÃO DE E-MAIL
              </div>

              <h1 style="font-family: 'Space Grotesk', sans-serif; color: #ffffff; font-size: 20px; font-weight: 600; margin: 0 0 12px 0; letter-spacing: -0.01em;">
                Código de verificação
              </h1>

              <p style="color: #a1a1aa; font-size: 14px; line-height: 1.5; margin: 0 0 28px 0;">
                Insira o código abaixo no aplicativo para confirmar a propriedade deste e-mail.
              </p>

              <!-- Bloco OTP Monocromático em Branco -->
              <div style="background-color: #000000; border: 1px solid #27272a; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px;">
                <div class="otp-code" style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 600; color: #ffffff; letter-spacing: 8px; padding-left: 8px;">
                  {{.Code}}
                </div>
              </div>

              <!-- Expiração Monocromática -->
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #71717a; margin-bottom: 28px;">
                Este código expira em <span style="color: #a1a1aa;">15 minutos</span>.
              </div>

              <div style="height: 1px; background-color: #27272a; margin-bottom: 20px;"></div>

              <p style="color: #71717a; font-size: 12px; line-height: 1.4; margin: 0;">
                Se você não solicitou este código, nenhuma ação é necessária.
              </p>

            </td>
          </tr>

          <!-- Footer Monocromático -->
          <tr>
            <td style="padding-top: 24px;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #52525b;">
                PlatOne &copy; 2026
              </span>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
