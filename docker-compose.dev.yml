services:
  mongodb_dev:
    image: mongo:7.0
    container_name: platone_mongodb_dev
    ports:
      - "${MONGODB_DEV_PORT:-27017}:27017"
    volumes:
      - mongodb_data_dev:/data/db
    restart: unless-stopped
    networks:
      - platone_dev_network

  backend:
    image: golang:1.25-alpine
    working_dir: /app
    command: sh -c "go mod tidy && go run main.go"
    ports:
      - "8085:8085"
    environment:
      GO_ENV: development
      PORT: 8085
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongodb_dev:27017/platone_dev}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
    depends_on:
      - mongodb_dev
    volumes:
      - ./backend/go:/app
    restart: unless-stopped
    networks:
      - platone_dev_network

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx tsx watch server.ts"
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8085
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongodb_dev:27017/platone_dev}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3005}
      DISABLE_HMR: "false"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "100"
    volumes:
      - ./frontend/react:/app
      - frontend_node_modules_dev:/app/node_modules
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - platone_dev_network
    depends_on:
      - backend

volumes:
  frontend_node_modules_dev:
  mongodb_data_dev:

networks:
  platone_dev_network:
    driver: bridge